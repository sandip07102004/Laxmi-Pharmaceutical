<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aventGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#F8FAFC"/>
  <!-- Silicone Teat -->
  <path d="M185 35 Q200 15 215 35 L225 70 L175 70 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" opacity="0.9"/>
  <!-- Dome Ring -->
  <rect x="160" y="70" width="80" height="30" rx="8" fill="#0284C7"/>
  <!-- Ergonomic Curved Bottle -->
  <path d="M165 100 L235 100 Q260 180 235 240 Q255 330 230 350 L170 350 Q145 330 165 240 Q140 180 165 100 Z" fill="url(#aventGlass)" stroke="#38BDF8" stroke-width="3"/>
  <!-- Graduation marks -->
  <line x1="225" y1="160" x2="240" y2="160" stroke="#0284C7" stroke-width="2"/>
  <line x1="220" y1="190" x2="240" y2="190" stroke="#0284C7" stroke-width="2"/>
  <line x1="225" y1="220" x2="240" y2="220" stroke="#0284C7" stroke-width="2"/>
  <line x1="220" y1="250" x2="240" y2="250" stroke="#0284C7" stroke-width="2"/>
  <!-- Brand text on bottle -->
  <text x="200" y="175" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#0369A1" text-anchor="middle">PHILIPS</text>
  <text x="200" y="198" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#0284C7" text-anchor="middle">AVENT</text>
  <text x="200" y="275" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#0369A1" text-anchor="middle">Anti-colic 260ml</text>
</svg>