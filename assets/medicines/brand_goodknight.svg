<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#EFF6FF"/>
  <!-- Machine Unit -->
  <rect x="120" y="70" width="160" height="150" rx="20" fill="#DC2626" stroke="#991B1B" stroke-width="3"/>
  <circle cx="200" cy="140" r="30" fill="#3B82F6"/>
  <text x="200" y="146" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">FLASH</text>
  <!-- Liquid Refill Bottle below -->
  <rect x="150" y="225" width="100" height="110" rx="12" fill="#60A5FA" stroke="#1D4ED8" stroke-width="2" opacity="0.9"/>
  <line x1="200" y1="210" x2="200" y2="240" stroke="#1E293B" stroke-width="8"/>
  <text x="200" y="275" font-family="'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">Good knight</text>
  <text x="200" y="295" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#FEF08A" text-anchor="middle">GOLD FLASH</text>
  <text x="200" y="360" font-family="Arial, sans-serif" font-weight="800" font-size="13" fill="#1E3A8A" text-anchor="middle">Mosquito Machine + Refill (45ml)</text>
