<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#603813"/>
      <stop offset="35%" stop-color="#99582a"/>
      <stop offset="70%" stop-color="#bb6b32"/>
      <stop offset="100%" stop-color="#542e0c"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Subtle shadow ellipse -->
  <ellipse cx="200" cy="350" rx="90" ry="12" fill="#000000" opacity="0.07"/>

  <!-- Bottle Group -->
  <g filter="url(#dropShadow)">
    <!-- Bottle Neck -->
    <rect x="175" y="85" width="50" height="45" rx="3" fill="url(#amberGlass)"/>
    <!-- Bottle Cap with ridges -->
    <rect x="168" y="58" width="64" height="34" rx="5" fill="url(#capGrad)"/>
    <line x1="178" y1="62" x2="178" y2="88" stroke="#475569" stroke-width="2"/>
    <line x1="188" y1="62" x2="188" y2="88" stroke="#475569" stroke-width="2"/>
    <line x1="198" y1="62" x2="198" y2="88" stroke="#475569" stroke-width="2"/>
    <line x1="208" y1="62" x2="208" y2="88" stroke="#475569" stroke-width="2"/>
    <line x1="218" y1="62" x2="218" y2="88" stroke="#475569" stroke-width="2"/>

    <!-- Bottle Body -->
    <path d="M 175,130 C 145,145 130,175 130,205 L 130,335 A 15,15 0 0,0 145,350 L 255,350 A 15,15 0 0,0 270,335 L 270,205 C 270,175 255,145 225,130 Z" fill="url(#amberGlass)"/>

    <!-- Glass Highlight -->
    <path d="M 142,205 L 142,330 A 8,8 0 0,0 148,338 L 152,338 L 152,205 Z" fill="#ffffff" opacity="0.18"/>

    <!-- Label -->
    <rect x="138" y="195" width="124" height="135" rx="6" fill="#fdfbf7" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Botanical Leaf Logo on Label -->
    <circle cx="200" cy="225" r="16" fill="url(#greenAccent)"/>
    <path d="M 200,215 C 208,217 212,223 208,231 C 200,233 194,228 200,215 Z" fill="#ffffff"/>
    <path d="M 200,215 C 192,217 188,223 192,231 C 200,233 206,228 200,215 Z" fill="#ffffff" opacity="0.75"/>

    <!-- Label Typography -->
    <text x="200" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#064e3b" text-anchor="middle" letter-spacing="1">BOTANICALS</text>
    <text x="200" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">Pure Herbal Extract</text>
    
    <rect x="156" y="286" width="88" height="1.5" fill="#10b981"/>
    
    <text x="200" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">GMP CERTIFIED · 100% VEG</text>
    <text x="200" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">60 Capsules</text>
  </g>
</svg>
