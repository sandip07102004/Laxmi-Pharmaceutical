name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Sync Web Assets to Android
        run: |
          node sync-web.js
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Laxmi-Pharma.apk
          ls -lh Laxmi-Pharma.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Laxmi-Pharma-APK
          path: Laxmi-Pharma.apk

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Laxmi Pharma v1.0.0 (Android APK)"
          body: |
            ### 🌿 Laxmi Pharma v1.0.0 — Official Android Application Release

            #### 📱 Native Android Experience:
            - **Official Laxmi Pharma Brand Icon:** Custom adaptive launcher icon with safe-zone inset framing.
            - **Silky Smooth Launch Animations:** Pure white launch splash screen with centered logo, 300ms fade-out transition, and 60fps GPU-accelerated page entry.
            - **Seamless Navigation:** Integrated white status bar with crisp dark icons and intelligent hardware Back button gesture handling.
            - **Complete Apothecary & Care Suite:** Full access to medicine catalog, chronic refills tracker, pharmacist consultation desk, prescription OCR uploader, and AI clinical assistant.

            #### 📦 Installation:
            Download and install **`Laxmi-Pharma.apk`** below on any Android phone (Android 7.0+).
          files: Laxmi-Pharma.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
