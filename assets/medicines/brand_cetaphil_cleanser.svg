<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#F8FAFC"/>
  <!-- Pump top -->
  <rect x="180" y="25" width="40" height="30" rx="6" fill="#0284C7"/>
  <rect x="155" y="32" width="25" height="12" fill="#0284C7"/>
  <!-- Bottle -->
  <rect x="120" y="55" width="160" height="290" rx="24" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
  <!-- Cetaphil Logo Arch -->
  <path d="M145 110 Q200 95 255 110 L255 155 Q200 170 145 155 Z" fill="#0284C7"/>
  <text x="200" y="140" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" text-anchor="middle">Cetaphil</text>
  <!-- Green Bar -->
  <rect x="145" y="170" width="110" height="8" rx="4" fill="#16A34A"/>
  <text x="200" y="205" font-family="Arial, sans-serif" font-weight="900" font-size="15" fill="#0F172A" text-anchor="middle">Gentle Skin</text>
  <text x="200" y="225" font-family="Arial, sans-serif" font-weight="900" font-size="17" fill="#0284C7" text-anchor="middle">Cleanser</text>
  <text x="200" y="255" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#64748B" text-anchor="middle">For Sensitive Skin</text>
  <text x="200" y="275" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#16A34A" text-anchor="middle">Hydrating Glycerin &amp; Niacinamide</text>
  <text x="200" y="320" font-family="Arial, sans-serif" font-weight="800" font-size="13" fill="#0F172A" text-anchor="middle">250ml Pump</text>
</svg>