<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tinGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C5E3F6"/>
      <stop offset="30%" stop-color="#E8F4FB"/>
      <stop offset="70%" stop-color="#C5E3F6"/>
      <stop offset="100%" stop-color="#99C5E4"/>
    </linearGradient>
    <linearGradient id="tinRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D1D5DB"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#F8FAFC"/>
  <!-- Tin Cylinder -->
  <rect x="85" y="60" width="230" height="280" rx="20" fill="url(#tinGrad)" stroke="#4A90E2" stroke-width="3"/>
  <ellipse cx="200" cy="65" rx="115" ry="16" fill="url(#tinRim)" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="85" y="100" width="230" height="35" fill="#0F4C81"/>
  <text x="200" y="124" font-family="Arial, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle">Nestlé</text>
  <text x="200" y="180" font-family="'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#0F4C81" text-anchor="middle">LACTOGEN</text>
  <!-- Stage 1 Big Badge -->
  <circle cx="200" cy="240" r="38" fill="#F43F5E" stroke="#FFFFFF" stroke-width="4"/>
  <text x="200" y="254" font-family="'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="200" y="300" font-family="Arial, sans-serif" font-weight="800" font-size="15" fill="#0F4C81" text-anchor="middle">INFANT FORMULA</text>
  <text x="200" y="320" font-family="Arial, sans-serif" font-weight="600" font-size="12" fill="#555" text-anchor="middle">With Whey Protein · 400g Tin</text>
</svg>