name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Sync Web Assets to Android
        run: |
          node sync-web.js
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Laxmi-Pharma.apk
          ls -lh Laxmi-Pharma.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Laxmi-Pharma-APK
          path: Laxmi-Pharma.apk

      - name: Clean up Old Releases & Tags
        run: |
          # Fetch and delete any old releases other than v1.0.1 to maintain a single release
          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases" | jq -r '.[] | select(.tag_name != "v1.0.1") | .id // empty')
          for id in $RELEASES; do
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              echo "Deleting old release ID $id..."
              curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/$id"
            fi
          done
          # Remove legacy v1.0.0 tag if lingering
          curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/v1.0.0" 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Laxmi Pharma v1.0.1"
          body: |
            🚀 Laxmi Pharma is now available on Android!

            Download the official standalone APK to order genuine medicines, manage chronic care refills, consult certified pharmacists, upload prescriptions, and chat with the AI health assistant on the go.

            ✨ Features:
            • Smooth 60fps GPU-accelerated performance & fluid page transitions
            • Native white status bar with crisp dark icons
            • Custom branded adaptive launcher icon & clean splash screen
            • Android hardware Back button navigation & gesture support
            • Complete pharmacy suite: Store, Refills, Consult, Rx Upload & AI Assistant
          files: Laxmi-Pharma.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

